name: Merge Stable metadata

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stable-metadata-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'release/v') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Validate and merge generated Stable metadata PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          PRS="$(gh pr list \
            --repo "$REPO" \
            --base main \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number,headRefOid)"

          PR_NUMBER="$(jq -r --arg sha "$HEAD_SHA" 'map(select(.headRefOid == $sha))[0].number // empty' <<<"$PRS")"
          if [ -z "$PR_NUMBER" ]; then
            echo "No matching open Stable metadata PR found for $HEAD_BRANCH at $HEAD_SHA."
            exit 0
          fi

          PR="$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json state,isDraft,baseRefName,headRefName,headRefOid,title,files)"

          jq -e \
            --arg branch "$HEAD_BRANCH" \
            --arg sha "$HEAD_SHA" \
            '
              .state == "OPEN" and
              .isDraft == false and
              .baseRefName == "main" and
              .headRefName == $branch and
              .headRefOid == $sha and
              (.title | startswith("docs: sync Stable v"))
            ' <<<"$PR" >/dev/null || {
              echo "::error::Stable metadata PR validation failed."
              exit 1
            }

          FILES="$(jq -r '.files[].path' <<<"$PR" | sort)"
          EXPECTED="$(printf '%s\n' README.md release-manifest.json | sort)"
          if [ "$FILES" != "$EXPECTED" ]; then
            echo "::error::Stable metadata PR changes unexpected files:"
            printf '%s\n' "$FILES"
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --merge \
            --match-head-commit "$HEAD_SHA"
