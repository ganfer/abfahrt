name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^const APP_VERSION = ['\"]\([0-9][0-9.]*\)['\"];$/\1/p" VagAbfahrten.js)
          if [ -z "$VERSION" ]; then
            echo "APP_VERSION could not be read from VagAbfahrten.js"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Stable version in README
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const path = 'README.md';
          const source = fs.readFileSync(path, 'utf8');
          const pattern = /^(\*\*Stable version: v)\d+\.\d+\.\d+(\*\*)$/m;
          if (!pattern.test(source)) {
            console.error('README Stable version line could not be found.');
            process.exit(1);
          }
          fs.writeFileSync(path, source.replace(pattern, `$1${version}$2`));
          NODE

      - name: Commit Stable version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README Stable version is already v$VERSION."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: mark v$VERSION as Stable"
            git push origin HEAD:main
          fi

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
