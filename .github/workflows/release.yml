name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^const APP_VERSION = ['\"]\([0-9][0-9.]*\)['\"];$/\1/p" abfahrt.js)
          if [ -z "$VERSION" ]; then
            echo "APP_VERSION could not be read from abfahrt.js"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; release creation will be skipped, metadata sync will still be checked."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release manifest
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const files = ['abfahrt.js', 'abfahrt-config.js'];
          const manifest = {
            schemaVersion: 1,
            version,
            files: files.map((name) => ({
              name,
              sha256: crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex'),
            })),
          };
          fs.writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Stabile Version im README aktualisieren
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const path = 'README.md';
          const source = fs.readFileSync(path, 'utf8');
          const pattern = /^(\*\*Stabile Version: v)\d+\.\d+\.\d+(\*\*)$/m;
          if (!pattern.test(source)) {
            console.error('README-Zeile für die stabile Version wurde nicht gefunden.');
            process.exit(1);
          }
          fs.writeFileSync(path, source.replace(pattern, `$1${version}$2`));
          NODE

      - name: Commit Stable metadata
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- README.md release-manifest.json)" ]; then
            echo "Stable metadata is already v$VERSION."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md release-manifest.json
            git commit -m "docs: mark v$VERSION as Stable"
          fi

      - name: Publish release metadata branch
        if: steps.existing.outputs.exists == 'false'
        id: target
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          RELEASE_BRANCH="release/v$VERSION"
          git push --force origin HEAD:"refs/heads/$RELEASE_BRANCH"
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ steps.target.outputs.sha }}
        run: gh release create "$TAG" --target "$TARGET" --title "$TAG" --generate-notes

      - name: Open and merge Stable metadata pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          RELEASE_BRANCH="release/v$VERSION"

          if ! git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "::error::Stable metadata branch $RELEASE_BRANCH does not exist."
            exit 1
          fi

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"

          if git diff --quiet "origin/main...origin/$RELEASE_BRANCH" -- README.md release-manifest.json; then
            echo "No Stable metadata changes need to be merged back to main."
            exit 0
          fi

          PR_NUMBER="$(gh pr list \
            --base main \
            --head "$RELEASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "docs: sync Stable v$VERSION metadata" \
              --body "Sync the generated Stable metadata for v$VERSION back to the protected main branch.")"
            PR_NUMBER="${PR_URL##*/}"
            echo "Opened Stable metadata PR #$PR_NUMBER."
          else
            echo "Stable metadata PR #$PR_NUMBER already exists."
          fi

          HEAD_SHA="$(git rev-parse "origin/$RELEASE_BRANCH")"
          PR="$(gh pr view "$PR_NUMBER" --json state,isDraft,baseRefName,headRefName,headRefOid,title,files)"

          jq -e \
            --arg branch "$RELEASE_BRANCH" \
            --arg sha "$HEAD_SHA" \
            --arg title "docs: sync Stable v$VERSION metadata" \
            '
              .state == "OPEN" and
              .isDraft == false and
              .baseRefName == "main" and
              .headRefName == $branch and
              .headRefOid == $sha and
              .title == $title
            ' <<<"$PR" >/dev/null || {
              echo "::error::Stable metadata PR validation failed."
              exit 1
            }

          FILES="$(jq -r '.files[].path' <<<"$PR" | sort)"
          EXPECTED="$(printf '%s\n' README.md release-manifest.json | sort)"
          if [ "$FILES" != "$EXPECTED" ]; then
            echo "::error::Stable metadata PR changes unexpected files:"
            printf '%s\n' "$FILES"
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --merge \
            --match-head-commit "$HEAD_SHA"
