name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Version consistency and bump check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-version-bump.js
      - name: Syntax check
        run: |
          node --check VagAbfahrten.js
          node --check VagAbfahrten-Config.js
          node --check VagAbfahrten-Init.js
          node --check test/widget.test.js
          node --check test/repository.test.js
      - name: Run tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml test/*.test.js
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-node-${{ matrix.node }}
          path: junit.xml
          if-no-files-found: warn
