name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Auto-bump patch version
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/bump-version.js
      - name: Commit automatic version bump
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- abfahrt.js abfahrt-config.js README.md; then
            echo "Version already matches the required patch version."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add abfahrt.js abfahrt-config.js README.md
            git commit -m "chore: bump updater version"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Version consistency check
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-version-bump.js
  test:
    name: Node 22
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check abfahrt.js
          node --check abfahrt-config.js
          node --check abfahrt-install.js
          node --check scripts/render-widget-preview.mjs
          node --check test/widget.test.js
          node --check test/repository.test.js
      - name: Run tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml test/*.test.js
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-node-22
          path: junit.xml
          if-no-files-found: warn
