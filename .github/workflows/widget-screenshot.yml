name: Widget screenshot

on:
  pull_request:
    paths:
      - 'Abfahrt.js'
      - 'Abfahrt-Config.js'
      - 'scripts/render-widget-preview.mjs'
      - '.github/workflows/widget-screenshot.yml'
  push:
    branches: [main]
    paths:
      - 'Abfahrt.js'
      - 'Abfahrt-Config.js'
      - 'scripts/render-widget-preview.mjs'
      - '.github/workflows/widget-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widget-screenshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render smartphone preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate deterministic preview HTML
        run: node scripts/render-widget-preview.mjs --output .preview/widget-preview.html

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Capture iPhone-sized screenshot
        shell: bash
        run: |
          mkdir -p docs/assets
          "${{ steps.chrome.outputs.chrome-path }}" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=430,932 \
            --force-device-scale-factor=1 \
            --screenshot=docs/assets/widget-preview.png \
            "file://${GITHUB_WORKSPACE}/.preview/widget-preview.html"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: widget-smartphone-preview-${{ github.sha }}
          path: docs/assets/widget-preview.png
          if-no-files-found: error

      - name: Commit refreshed README screenshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- docs/assets/widget-preview.png; then
            echo "Widget screenshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/widget-preview.png
          git commit -m "docs: refresh widget screenshot"
          git push
